<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Matches — Lost & Found</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="index.html">Post Item</a>
    <a href="browse.html">Browse Found</a>
    <a href="matches.html" class="active">My Matches</a>
    <a href="claims.html">Review Claims</a>
    <a href="activity.html">My Activity</a>
    <a href="#" id="logoutLink">Log out</a>
  </nav>

  <div class="container" style="max-width: 900px;">
    <div class="card">
      <h1>My matches</h1>
      <p class="subtitle">Auto-matched items based on your posts</p>
    </div>

    <div id="matchList" class="tile-grid" style="margin-top: 24px;"></div>
  </div>

<script src="js/api.js"></script>
<script>
  requireAuth();

  document.getElementById("logoutLink").addEventListener("click", (e) => {
    e.preventDefault();
    clearToken();
    window.location.href = "login.html";
  });

  async function loadMatches() {
    const matchList = document.getElementById("matchList");
    matchList.innerHTML = `<p style="color: var(--muted);">Loading...</p>`;

    try {
      const matches = await apiRequest("/items/my-matches");
      if (matches.length === 0) {
        matchList.innerHTML = `<p style="color: var(--muted);">No matches yet. Check back after posting an item.</p>`;
        return;
      }

      const cards = await Promise.all(matches.map(async (m) => {
        const [lostItem, foundItem] = await Promise.all([
          apiRequest(`/items/${m.lost_item_id}`),
          apiRequest(`/items/${m.found_item_id}`),
        ]);
        const pct = Math.round(m.similarity_score * 100);

        return `
          <div class="item-card">
            <span class="badge badge-${m.status === 'confirmed' ? 'found' : 'lost'}">${m.status}</span>
            <h3>${pct}% confidence match</h3>
            <p><strong>Lost:</strong> ${lostItem.category} — ${lostItem.description}</p>
            <p><strong>Found:</strong> ${foundItem.category} — ${foundItem.description}</p>
            <p><strong>Locations:</strong> ${lostItem.location} → ${foundItem.location}</p>
            <div class="similarity-bar"><div class="similarity-fill" style="width:${pct}%"></div></div>
            ${m.status === 'pending' ? `<button onclick="approveMatch('${m.id}')">Confirm this match</button>` : ''}
          </div>
        `;
      }));

      matchList.innerHTML = cards.join("");
    } catch (err) {
      matchList.innerHTML = `<p style="color: var(--danger);">${err.message}</p>`;
    }
  }

  async function approveMatch(matchId) {
    try {
      await apiRequest(`/items/matches/${matchId}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: "confirmed" }),
      });
      loadMatches();
    } catch (err) {
      alert("Error: " + err.message);
    }
  }

  loadMatches();
</script>
</body>
</html>
